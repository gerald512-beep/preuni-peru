<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solucionario UNI 2019-2 — Revisión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
:root{
  --paper:#F6F4EF; --paper-raise:#FFFFFF; --ink:#201F28; --ink-soft:#5A5765;
  --accent:#2B3F6B; --accent-soft:#E4E8F2; --accent-2:#3E7368; --accent-2-soft:#E1EEEB;
  --good:#2F6B3E; --good-soft:#E5F0E3; --warn:#92650E; --warn-soft:#F7ECD3;
  --line:#DEDAD0; --line-soft:#EAE7DF; --shadow:0 1px 2px rgba(32,31,40,.06),0 2px 8px rgba(32,31,40,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17161C; --paper-raise:#201F27; --ink:#EDEBF2; --ink-soft:#A9A6B5;
    --accent:#8CA3D9; --accent-soft:#232B42; --accent-2:#7FC2B4; --accent-2-soft:#1E2E2A;
    --good:#7FCB8F; --good-soft:#1B3020; --warn:#E0B054; --warn-soft:#3A2E12;
    --line:#34323C; --line-soft:#2A2933; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#17161C; --paper-raise:#201F27; --ink:#EDEBF2; --ink-soft:#A9A6B5;
  --accent:#8CA3D9; --accent-soft:#232B42; --accent-2:#7FC2B4; --accent-2-soft:#1E2E2A;
  --good:#7FCB8F; --good-soft:#1B3020; --warn:#E0B054; --warn-soft:#3A2E12;
  --line:#34323C; --line-soft:#2A2933; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; line-height:1.5;
  padding:0 20px; padding-block:28px 60px;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0}
.wrap{max-width:1080px; margin:0 auto}

header{margin-bottom:28px}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--accent-2); margin-bottom:6px}
h1{font-size:clamp(26px,4vw,34px); font-weight:600; color:var(--ink)}
.subtitle{color:var(--ink-soft); font-size:14.5px; margin-top:6px; max-width:65ch}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:22px 0}
.stat{background:var(--paper-raise); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow)}
.stat .n{font-family:'Fraunces',serif; font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1}
.stat .l{font-size:11.5px; color:var(--ink-soft); margin-top:3px; letter-spacing:.02em}
.stat.good .n{color:var(--good)}
.stat.warn .n{color:var(--warn)}
.stat.accent .n{color:var(--accent)}

.materias{background:var(--paper-raise); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:22px; box-shadow:var(--shadow)}
.materias h2{font-size:14px; font-weight:600; margin-bottom:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Sans'}
.materia-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 18px}
.materia-row{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:13px; border-bottom:1px dashed var(--line-soft)}
.materia-row .name{color:var(--ink)}
.materia-row .count{font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; color:var(--ink-soft); white-space:nowrap; margin-left:10px}
.materia-row .count b{color:var(--warn)}

.toolbar{position:sticky; top:0; z-index:10; background:var(--paper); padding:12px 0; margin-bottom:6px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line)}
.search{flex:1; min-width:180px; padding:9px 13px; border-radius:8px; border:1px solid var(--line); background:var(--paper-raise); color:var(--ink); font-family:inherit; font-size:13.5px}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px}
.chip{padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--paper-raise); color:var(--ink-soft); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap; transition:all .12s}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--paper)}
.chip.active.warn-chip{background:var(--warn); border-color:var(--warn)}
.result-count{font-size:12px; color:var(--ink-soft); margin:10px 2px 12px; font-family:'IBM Plex Mono'}

.qlist{display:flex; flex-direction:column; gap:7px}
.qrow{background:var(--paper-raise); border:1px solid var(--line); border-radius:9px; overflow:hidden; transition:border-color .12s}
.qrow.open{border-color:var(--accent)}
.qhead{display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer; user-select:none}
.qhead:hover{background:var(--line-soft)}
.qid{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-soft); flex-shrink:0; width:64px; font-variant-numeric:tabular-nums}
.qtema{font-size:11px; font-weight:600; padding:3px 9px; border-radius:5px; flex-shrink:0; background:var(--accent-2-soft); color:var(--accent-2); white-space:nowrap}
.qpreview{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-size:13px}
.qclave{font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; flex-shrink:0; width:22px; text-align:center; color:var(--good)}
.qclave.missing{color:var(--line)}
.qstatus{flex-shrink:0; width:9px; height:9px; border-radius:50%; background:var(--good)}
.qstatus.flag{background:var(--warn)}
.qstatus.reviewed{background:var(--accent-2)}
.refresh-btn{padding:7px 13px; border-radius:8px; border:1px solid var(--line); background:var(--paper-raise); color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap}
.refresh-btn:hover{border-color:var(--accent)}
.live-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-right:5px}
.qcaret{flex-shrink:0; color:var(--ink-soft); font-size:11px; transition:transform .15s}
.qrow.open .qcaret{transform:rotate(90deg)}

.qbody{display:none; padding:4px 18px 18px 18px; border-top:1px solid var(--line-soft)}
.qrow.open .qbody{display:block}
.qflags{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:10px 0 4px}
.flag-pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:5px; background:var(--warn-soft); color:var(--warn)}
.edit-link{font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:5px; background:var(--accent); color:var(--paper); text-decoration:none; margin-left:auto}
.edit-link:hover{opacity:.88}
.qtext{margin:10px 0; font-size:14.5px; line-height:1.65}
.choices{display:grid; gap:6px; margin:12px 0}
.choice{display:flex; gap:10px; align-items:flex-start; padding:8px 11px; border-radius:6px; border:1px solid var(--line-soft); font-size:13.5px}
.choice.correct{border-color:var(--good); background:var(--good-soft)}
.choice .letter{font-family:'IBM Plex Mono'; font-weight:700; color:var(--ink-soft); flex-shrink:0}
.choice.correct .letter{color:var(--good)}
.choice img{max-width:220px; max-height:140px; border-radius:4px; border:1px solid var(--line)}
.figrow{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0}
.figrow img{max-width:280px; max-height:200px; border-radius:6px; border:1px solid var(--line)}
.meta-line{font-size:12px; color:var(--ink-soft); margin-top:10px; font-family:'IBM Plex Mono'}
.solution{margin-top:14px; padding:12px 14px; border-radius:7px; background:var(--accent-soft); border-left:3px solid var(--accent); font-size:13.5px; line-height:1.6}
.solution .lbl{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-bottom:6px}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft)}

.publish-panel{background:var(--paper-raise); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:22px; box-shadow:var(--shadow)}
.publish-panel h2{font-size:14px; font-weight:600; margin-bottom:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Sans'}
.publish-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.pub-btn{padding:9px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--paper); font-size:13px; font-weight:600; cursor:pointer}
.pub-btn:disabled{opacity:.5; cursor:not-allowed}
.pub-btn.stop{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.pub-count{font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono'}
.pub-bar-wrap{flex:1; min-width:160px; height:8px; border-radius:5px; background:var(--line-soft); overflow:hidden}
.pub-bar{height:100%; background:var(--accent); width:0%; transition:width .2s}
.pub-log{margin-top:10px; max-height:150px; overflow-y:auto; font-family:'IBM Plex Mono'; font-size:11.5px; display:none}
.pub-log.show{display:block}
.pub-log div{padding:2px 0; color:var(--ink-soft)}
.pub-log div.err{color:var(--warn)}
.qpub{flex-shrink:0; font-size:11px; color:var(--accent-2); text-decoration:none; white-space:nowrap}
.qpub:hover{text-decoration:underline}

@media (max-width:600px){
  .qpreview{display:none}
  .qid{width:auto}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Bulk pipeline · Revisión de parsing</div>
    <h1>Solucionario UNI 2019&#8209;2</h1>
    <div class="subtitle"><span class="live-dot"></span>218 preguntas extraídas de Prueba 1 (Aptitud Académica y Humanidades), Prueba 2 (Matemática), Prueba 3 (Física y Química) y Traslado Externo. Datos en vivo — revisa antes de publicar en Discourse.</div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="materias" id="materias"></div>

  <div class="publish-panel">
    <h2>Publicar en Discourse</h2>
    <div class="publish-row">
      <button class="pub-btn" id="pubBtn" onclick="runBulkPublish()">▶ Publicar pendientes</button>
      <button class="pub-btn stop" id="pubStopBtn" onclick="stopBulkPublish()" style="display:none">■ Detener</button>
      <div class="pub-bar-wrap"><div class="pub-bar" id="pubBar"></div></div>
      <span class="pub-count" id="pubCount"></span>
    </div>
    <div class="pub-log" id="pubLog"></div>
  </div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Buscar por texto, N° o id…">
    <button class="chip active" data-filter="all">Todas</button>
    <button class="chip" data-filter="clean">Limpias</button>
    <button class="chip warn-chip" data-filter="flagged">Por revisar</button>
    <button class="chip" data-filter="reviewed">Revisadas</button>
    <button class="chip" data-filter="published">Publicadas</button>
    <button class="refresh-btn" onclick="loadData()">↻ Actualizar</button>
  </div>
  <div class="result-count" id="resultCount"></div>
  <div class="qlist" id="qlist"></div>
</div>

<script>
let DATA = [];
let activeFilter = 'all';
let searchTerm = '';

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Three states: flagged (still has issues) beats reviewed (fixed by hand) beats
// clean (never needed attention). manuallyFixed is set by the composer's
// "Guardar cambios" — see PUT /api/bulk-question/:id in server.js.
function getStatus(r){
  if (r.needsReview.length > 0) return 'flagged';
  if (r.manuallyFixed) return 'reviewed';
  return 'clean';
}

function renderStats(){
  const total = DATA.length;
  const statuses = DATA.map(getStatus);
  const clean = statuses.filter(s => s === 'clean').length;
  const reviewed = statuses.filter(s => s === 'reviewed').length;
  const flagged = statuses.filter(s => s === 'flagged').length;
  const published = DATA.filter(r => r.published).length;
  const pruebas = new Set(DATA.map(r => r.prueba)).size;
  document.getElementById('stats').innerHTML = `
    <div class="stat accent"><div class="n">${total}</div><div class="l">Preguntas totales</div></div>
    <div class="stat good"><div class="n">${clean}</div><div class="l">Limpias (${total ? Math.round(clean/total*100) : 0}%)</div></div>
    <div class="stat"><div class="n" style="color:var(--accent-2)">${reviewed}</div><div class="l">Revisadas a mano</div></div>
    <div class="stat warn"><div class="n">${flagged}</div><div class="l">Por revisar</div></div>
    <div class="stat"><div class="n" style="color:var(--accent)">${published}</div><div class="l">Publicadas (${total ? Math.round(published/total*100) : 0}%)</div></div>
    <div class="stat"><div class="n">${pruebas}</div><div class="l">Pruebas incluidas</div></div>
  `;
}

function renderMaterias(){
  const byMateria = {};
  DATA.forEach(r => {
    byMateria[r.materiaHeader] = byMateria[r.materiaHeader] || { total:0, flagged:0, prueba:r.prueba };
    byMateria[r.materiaHeader].total++;
    if (r.needsReview.length) byMateria[r.materiaHeader].flagged++;
  });
  const rows = Object.entries(byMateria)
    .sort((a,b) => String(a[1].prueba).localeCompare(String(b[1].prueba)))
    .map(([name, s]) => `
      <div class="materia-row">
        <span class="name">${esc(name)}</span>
        <span class="count">${s.total}${s.flagged ? ` · <b>${s.flagged}</b>` : ''}</span>
      </div>
    `).join('');
  document.getElementById('materias').innerHTML = `<h2>Por sección</h2><div class="materia-grid">${rows}</div>`;
}

function matchesSearch(r, term){
  if (!term) return true;
  const hay = (r.id + ' ' + r.numero + ' ' + r.body + ' ' + r.materiaHeader).toLowerCase();
  return hay.includes(term);
}

function renderList(){
  let items = DATA;
  if (activeFilter === 'published') items = items.filter(r => r.published);
  else if (activeFilter !== 'all') items = items.filter(r => getStatus(r) === activeFilter);
  if (searchTerm) items = items.filter(r => matchesSearch(r, searchTerm));

  document.getElementById('resultCount').textContent = `${items.length} de ${DATA.length} preguntas`;

  if (!items.length) {
    document.getElementById('qlist').innerHTML = `<div class="empty-state">Sin resultados para este filtro.</div>`;
    return;
  }

  document.getElementById('qlist').innerHTML = items.map((r) => {
    const preview = r.body.replace(/\$[^$]*\$/g, '').replace(/\s+/g,' ').trim().slice(0, 90);
    const status = getStatus(r);
    return `
      <div class="qrow" data-idx="${DATA.indexOf(r)}">
        <div class="qhead" onclick="toggleRow(this.parentElement)">
          <span class="qstatus ${status === 'flagged' ? 'flag' : status === 'reviewed' ? 'reviewed' : ''}"></span>
          <span class="qid">${esc(r.id.split('-').slice(-2).join(' N°'))}</span>
          <span class="qtema">${esc(r.tema || '—')}</span>
          <span class="qpreview">${esc(preview)}</span>
          <span class="qclave ${!r.clave ? 'missing' : ''}">${r.clave || '?'}</span>
          ${r.published ? `<a class="qpub" href="${r.topicUrl}" target="_blank" onclick="event.stopPropagation()">📤 publicada</a>` : ''}
          <span class="qcaret">▸</span>
        </div>
        <div class="qbody"></div>
      </div>
    `;
  }).join('');
}

function toggleRow(row){
  const isOpen = row.classList.contains('open');
  document.querySelectorAll('.qrow.open').forEach(r => { if (r !== row) r.classList.remove('open'); });
  if (isOpen) { row.classList.remove('open'); return; }
  row.classList.add('open');
  const idx = parseInt(row.dataset.idx, 10);
  const r = DATA[idx];
  const body = row.querySelector('.qbody');
  body.innerHTML = renderDetail(r); // re-render each time — data may have changed since last open
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([body]);
}

function renderDetail(r){
  const flagsHtml = r.needsReview.length
    ? `<div class="qflags">
         ${r.needsReview.map(f => `<span class="flag-pill">${esc(f)}</span>`).join('')}
         <a class="edit-link" href="/question-composer-prototype.html?bulk_id=${encodeURIComponent(r.id)}" target="_blank">✏️ Editar en el composer</a>
       </div>`
    : (r.manuallyFixed ? `<div class="qflags"><span class="flag-pill" style="background:var(--accent-2-soft);color:var(--accent-2)">revisada a mano</span>
         <a class="edit-link" href="/question-composer-prototype.html?bulk_id=${encodeURIComponent(r.id)}" target="_blank">✏️ Editar en el composer</a></div>` : '');

  const choicesHtml = ['A','B','C','D','E'].map(l => {
    const isCorrect = r.clave === l;
    const text = r.choices[l];
    const img = r.choiceImages?.[l];
    const content = img ? `<img src="${img}" style="max-height:70px;border-radius:4px">`
      : text ? esc(text) : '<em style="color:var(--ink-soft)">(vacío)</em>';
    return `<div class="choice ${isCorrect ? 'correct' : ''}"><span class="letter">${l}</span><span>${content}</span></div>`;
  }).join('');

  const bodyHtml = renderTextWithFigures(r.body, r.figureImages);
  const solutionHtml = r.solutionBody
    ? `<div class="solution"><div class="lbl">Solución</div>${renderTextWithFigures(r.solutionBody, r.solutionFigureImages)}</div>`
    : '';

  return `
    ${flagsHtml}
    <div class="qtext">${bodyHtml}</div>
    <div class="choices">${choicesHtml}</div>
    ${solutionHtml}
    <div class="meta-line">${r.id} · ${r.universidad} ${r.anio}-${r.convocatoria} · tema=${r.tema} · método OA=${r.oaMethod || 'n/a'} · sub-temas: ${(r.subtemas||[]).join(', ') || '—'}${r.published ? ` · <a href="${r.topicUrl}" target="_blank" style="color:var(--accent-2)">📤 ver en Discourse ↗</a>` : ''}</div>
  `;
}

// Renders body/solution text with [FIG:N] markers interpolated as inline
// images at their actual position — matches the composer's own bodyToHtml
// convention. Any figureImages beyond the highest marker index (shouldn't
// normally happen) fall back to a small gallery so nothing is silently lost.
function renderTextWithFigures(text, figureImages){
  if (!text) return '<em style="color:var(--ink-soft)">(vacío)</em>';
  const used = new Set();
  let html = esc(text).replace(/\[FIG:(\d+)\]/g, (_, n) => {
    const idx = parseInt(n, 10);
    used.add(idx);
    const src = figureImages?.[idx];
    return src ? `<div style="text-align:center;margin:10px 0"><img src="${src}" style="max-width:100%;max-height:260px;border-radius:6px;border:1px solid var(--line)"></div>` : '';
  });
  html = html.replace(/\n/g, '<br>');
  const leftover = (figureImages || []).filter((_, i) => !used.has(i));
  if (leftover.length) html += `<div class="figrow">${leftover.map(src => `<img src="${src}">`).join('')}</div>`;
  return html;
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderList();
});
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    renderList();
  });
});

// ── Bulk publish: loops the clean/reviewed records into /api/publish ───────
let publishRunning = false;
let stopRequested = false;

function pendingToPublish(){
  return DATA.filter(r => !r.published && r.needsReview.length === 0);
}

function refreshPubCount(){
  if (publishRunning) return; // the run loop owns pubCount text while active
  const pending = pendingToPublish().length;
  document.getElementById('pubCount').textContent = `${pending} pendientes de publicar`;
}

function logPub(msg, isErr){
  const log = document.getElementById('pubLog');
  log.classList.add('show');
  const line = document.createElement('div');
  if (isErr) line.className = 'err';
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function recordToPublishPayload(r){
  const hasSolucion = (r.solutionBody && r.solutionBody.trim()) || (r.solutionFigureImages || []).length > 0;
  return {
    universidad: r.universidad,
    tema: r.tema,
    anio: r.anio,
    convocatoria: r.convocatoria,
    numero: r.numero,
    body: r.body,
    choices: r.choices,
    choice_images: r.choiceImages || {},
    figure_images: r.figureImages || [],
    clave: r.clave,
    tipo_origen: 'Universidad',
    subtemas: r.subtemas || [],
    solucion: hasSolucion ? { body: r.solutionBody || '', figure_images: r.solutionFigureImages || [] } : null,
  };
}

async function publishOne(r){
  const res = await fetch('/api/publish', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(recordToPublishPayload(r)),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);

  await fetch(`/api/bulk-question/${encodeURIComponent(r.id)}/publish`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topicId: data.topic_id, topicUrl: data.topic_url }),
  });

  r.published = true;
  r.topicId = data.topic_id;
  r.topicUrl = data.topic_url;
  return data.solution_error || null;
}

async function runBulkPublish(){
  if (publishRunning) return;
  const queue = pendingToPublish();
  if (!queue.length) { logPub('No hay preguntas pendientes de publicar.'); return; }

  publishRunning = true;
  stopRequested = false;
  document.getElementById('pubBtn').disabled = true;
  document.getElementById('pubStopBtn').style.display = '';
  document.getElementById('pubLog').innerHTML = '';
  document.getElementById('pubLog').classList.add('show');

  const total = queue.length;
  let done = 0, failed = 0;

  for (const r of queue) {
    if (stopRequested) { logPub(`Detenido por el usuario en ${done}/${total}.`); break; }
    try {
      const solutionError = await publishOne(r);
      done++;
      logPub(`✓ ${r.id} → ${r.topicUrl}`);
      if (solutionError) logPub(`  ⚠ ${r.id}: solución no se publicó (${solutionError})`, true);
    } catch (err) {
      failed++;
      logPub(`✗ ${r.id}: ${err.message}`, true);
    }
    const pct = Math.round((done + failed) / total * 100);
    document.getElementById('pubBar').style.width = pct + '%';
    document.getElementById('pubCount').textContent = `${done + failed}/${total} (${done} ok, ${failed} error)`;
    renderStats();
    if (document.querySelector('.qrow.open')) renderList(); // keep open detail rows in sync if visible
    await new Promise(res => setTimeout(res, 1500)); // stay clear of Discourse's per-second create-post/topic rate limit
  }

  publishRunning = false;
  document.getElementById('pubBtn').disabled = false;
  document.getElementById('pubStopBtn').style.display = 'none';
  logPub(`Terminado: ${done} publicadas, ${failed} con error.`);
  renderStats();
  renderList();
  refreshPubCount();
}

function stopBulkPublish(){
  stopRequested = true;
}

async function loadData(){
  try {
    const data = await fetch('/api/bulk-data').then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); });
    DATA = data;
  } catch (err) {
    document.getElementById('qlist').innerHTML = `<div class="empty-state">Error cargando datos: ${err.message}</div>`;
    return;
  }
  renderStats();
  renderMaterias();
  renderList();
  refreshPubCount();
}

loadData();
</script>
